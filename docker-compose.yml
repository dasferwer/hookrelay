name: 11-hookrelay

x-app: &app
  build:
    context: .
    target: runtime
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@database:5432/hookrelay
    JWT_SECRET: ${JWT_SECRET:-local-demo-hookrelay-replace-before-deployment}
    WORKER_INTERVAL: ${WORKER_INTERVAL:-0.5}
    AMQP_URL: amqp://hookrelay:hookrelay@rabbitmq:5672/
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-MD9gxAdH_kBCHi-DxCbhfy0rla-OSZciWC9TIWlZg50=}
    ALLOWED_INSECURE_HOSTS: '["receiver"]'
    RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-1}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
    LEASE_SECONDS: ${LEASE_SECONDS:-10}
    DEMO_RECEIVER_TOKEN: ${DEMO_RECEIVER_TOKEN:-local-receiver-control}
  restart: unless-stopped
  init: true

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8110:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py", "worker"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    command: ["python", "-m", "hookrelay.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hookrelay
      RABBITMQ_DEFAULT_PASS: hookrelay
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  dispatcher:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py", "dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    command: ["python", "-m", "hookrelay.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  receiver:
    <<: *app
    command: ["uvicorn", "hookrelay.receiver:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8111:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: hookrelay_test
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      <<: *environment
      DATABASE_URL: postgresql+asyncpg://hookrelay:hookrelay@test-db:5432/hookrelay_test
      TESTING: "true"
    depends_on:
      test-db:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  rabbitmq_data:
